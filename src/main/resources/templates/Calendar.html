<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="/css/Calendar.css">
</head>
<body>
<header>
    <div class="calendar-container">
        <div class="calendar-header" id="calendar-header">오늘 : {?}</div>
        <div class="calendar" id="calendar"></div>
    </div>
</header>
<main>
    <div class="menu-container">
        <div id="sideMenu" class="side-menu">
            <div class="menu-header">
                <button id="closeButton" class="close-button">✕</button>
            </div>
            <ul>
                <li><a href="/report/statistics">투약 통계</a></li>
                <li><a href="/mypage">마이 페이지</a></li>
                <li><a href="/logout">로그아웃</a></li>
                <li><a href="/admin/users">관리자 화면</a></li>
            </ul>
        </div>
        <button id="menuButton" class="menu-button">☰</button>
    </div>
    <div class="dose-schedule-container">
        <table>
            <thead>
            <tr>
                <th>시간</th>
                <th>약물명</th>
                <th>용량</th>
                <th>요일</th>
                <th>삭제/수정</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td colspan="5">날짜를 선택하면 데이터가 표시됩니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<button id="add-schedule-button">+</button>
<button id="show-modal-button" class="floating-button">?</button>

<!-- Modal Structure -->
<div id="ai-modal" class="modal" style="display: none;">
    <div class="modal-content centered">
        <h1>삐약이에게 질문하기</h1>
        <form id="aiForm" class="centered">
            <label for="contentInput"></label>
            <input type="text" id="contentInput" name="content" required>
            <button type="submit" class="centered-button">물어보기</button>
        </form>
        <h2>삐약이의 대답</h2>
        <pre id="responseContent" class="wrapped-content centered">삐약이가 생각하는중...</pre>
        <button id="close-modal-button" class="centered-button">Close</button>
    </div>
</div>

<script src="/js/Calendar.js"></script>
<script>
    document.getElementById('show-modal-button').addEventListener('click', () => {
        document.getElementById('ai-modal').style.display = 'block';
    });

    document.getElementById('close-modal-button').addEventListener('click', () => {
        document.getElementById('ai-modal').style.display = 'none';
    });

    document.getElementById('aiForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const content = document.getElementById('contentInput').value;

        try {
            const response = await fetch(`http://localhost:8080/api/ai/proxy?content=${encodeURIComponent(content)}`, {
                method: 'GET'
            });

            const result = await response.json();
            document.getElementById('responseContent').textContent = result.content || 'No content found';
        } catch (error) {
            document.getElementById('responseContent').textContent = 'Error fetching response.';
            console.error('Error:', error);
        }
    });
</script>

<style>
    .modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        width: auto;
        max-width: 90vw;
        max-height: 80vh;
        overflow-wrap: break-word;
        word-wrap: break-word;
        hyphens: auto;
    }
    .centered {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .wrapped-content {
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .centered-button {
        display: block;
        margin: 20px auto 0;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .floating-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #007bff;
        color: white;
        font-size: 24px;
        border: none;
        cursor: pointer;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
        z-index: 1000;
    }
</style>
</body>
</html>
